# Publica o PWA no GitHub Pages a cada push na branch de desenvolvimento.
# Depois do primeiro deploy, abra a URL no celular e use "Adicionar a tela
# inicial" para instalar o app.
name: Deploy PWA

on:
  push:
    branches: [claude/pokemon-champions-team-builder-d561ca, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
        # Liga o GitHub Pages sozinho na primeira execucao, em vez de exigir
        # que alguem va em Settings > Pages antes do primeiro deploy.
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
